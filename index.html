<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monster Quest — 8-Stage Pet Journey</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07142f}
  body{font-family:"Comic Sans MS","Comic Neue","Trebuchet MS",system-ui,sans-serif}
  #cover{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#284a96 0%,#0d1b45 62%,#061126 100%);
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:min(95vw,calc(95dvh * 1.5003663));
    aspect-ratio:2048/1365;
    max-height:95dvh;
    cursor:pointer;
    touch-action:manipulation;
  }
  #coverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-select:none;pointer-events:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.34))}
  #startQuest{
    /* Match the START QUEST button printed on the cover artwork. */
    position:absolute;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%);
    width:35%;
    height:10%;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.001);
    color:transparent;
    cursor:pointer;
    z-index:3;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  #startQuest:focus-visible{outline:4px solid rgba(255,244,120,.95);outline-offset:3px}
  #startQuest:disabled{cursor:wait}
  #loading{
    position:absolute;left:50%;top:86%;transform:translateX(-50%);display:none;
    color:#fff;font-size:clamp(16px,4vw,26px);font-weight:900;text-shadow:0 3px 10px #000;
    white-space:nowrap;z-index:4;
  }
  #cover.busy #loading{display:block}
  #status{
    position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
    color:#fff;background:rgba(4,16,44,.78);padding:8px 12px;border-radius:999px;font-weight:800;
    font-size:13px;display:none;z-index:5;
  }
  #status.show{display:block}
</style>
</head>
<body>
<div id="cover" aria-label="Monster Quest start screen">
  <div id="stage">
    <img id="coverImg" alt="Monster Quest: Rise of King Hullabaloo cover">
    <button id="startQuest" type="button" aria-label="Start Quest" disabled>START QUEST</button>
    <div id="loading">Loading Quest...</div>
  </div>
</div>
<div id="status">Loading cover…</div>
<script>
(()=>{
  const cover=document.getElementById('cover');
  const stage=document.getElementById('stage');
  const img=document.getElementById('coverImg');
  const btn=document.getElementById('startQuest');
  const status=document.getElementById('status');
  let gameHtml='';
  let startSoundSrc='';

  function showStatus(t){
    status.textContent=t;
    status.classList.add('show');
  }

  async function prepare(){
    try{
      showStatus('Loading cover…');
      const res=await fetch('./game.html?v=20260926-coverfix',{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      gameHtml=await res.text();

      const imageMatch=gameHtml.match(/<img class="mq-cover-img" src="([^"]+)"/);
      if(!imageMatch) throw new Error('Cover artwork not found');
      img.src=imageMatch[1];

      const audioMatch=gameHtml.match(/<audio id="mqStartSound"[\s\S]*?<source src="([^"]+)"/);
      if(audioMatch) startSoundSrc=audioMatch[1];

      if(img.decode){
        try{ await img.decode(); }catch(_){}
      }
      btn.disabled=false;
      status.classList.remove('show');
    }catch(err){
      showStatus('Tap to retry loading');
      status.style.cursor='pointer';
      status.onclick=prepare;
    }
  }

  function launch(){
    if(!gameHtml || btn.disabled) return;
    btn.disabled=true;
    cover.classList.add('busy');

    if(startSoundSrc){
      try{
        const a=new Audio(startSoundSrc);
        a.volume=1;
        const p=a.play();
        if(p && p.catch) p.catch(()=>{});
      }catch(_){}
    }

    const skipCoverCss='<style id="mqWrapperSkipCover">#mqCoverScreen{display:none!important;pointer-events:none!important}body.cover-active{overflow-y:auto!important;overflow-x:hidden!important}</style>';

    const questMobileLayoutCss=`
<style id="mqQuestMobileLayoutFix">
@media (max-width:800px){
  html,body{
    height:auto!important;
    min-height:100%!important;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior-y:auto!important;
    touch-action:pan-y!important;
  }

  /* The game adds stage-open to freeze the map behind a stage.
     On phones this can remain stale after free practice and trap scrolling. */
  html.stage-open,
  html.stage-open body,
  body.stage-open{
    height:auto!important;
    min-height:100%!important;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior-y:auto!important;
    touch-action:pan-y!important;
  }

  .stage-frame{
    overflow:auto!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior:contain!important;
    touch-action:pan-y!important;
  }

  .stage-overlay{
    touch-action:pan-y!important;
  }

  .map-practice-row,
  .practice-card,
  .practice-grid{
    touch-action:pan-y!important;
  }

  .mq-mobile-stack-fix{
    display:flex!important;
    flex-direction:column!important;
    grid-template-columns:1fr!important;
    width:100%!important;
    max-width:100%!important;
    height:auto!important;
    min-height:0!important;
    overflow:visible!important;
    align-items:stretch!important;
  }
  .mq-mobile-stack-fix > *{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    height:auto!important;
    position:relative!important;
    left:auto!important;
    right:auto!important;
    top:auto!important;
    bottom:auto!important;
    transform:none!important;
  }
  .mq-mobile-working-card-fix{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    margin-left:0!important;
    margin-right:0!important;
  }
}
</style>`;

    const questMobileLayoutScript=`
<script id="mqQuestMobileLayoutScript">
(function(){
  function txt(el){ return (el && el.textContent || '').replace(/\\s+/g,' ').trim(); }

  function findWorkingCards(){
    const all=[...document.querySelectorAll('body *')];
    const headings=all.filter(el=>{
      const t=txt(el);
      return t==='Working Space' && el.children.length<=3;
    });

    headings.forEach(h=>{
      let card=h;
      for(let i=0;i<7 && card.parentElement;i++){
        if(txt(card).includes('Clear Working')) break;
        card=card.parentElement;
      }
      if(!card || card===document.body) return;
      card.classList.add('mq-mobile-working-card-fix');

      let node=card;
      for(let depth=0;depth<8 && node.parentElement && node.parentElement!==document.body;depth++){
        const parent=node.parentElement;
        const branch=[...parent.children].find(ch=>ch===node || ch.contains(card));
        if(!branch){ node=parent; continue; }

        const br=branch.getBoundingClientRect();
        const horizontalSibling=[...parent.children].some(ch=>{
          if(ch===branch || ch.contains(card)) return false;
          const r=ch.getBoundingClientRect();
          if(r.width<40 || r.height<40 || br.width<40 || br.height<40) return false;
          const verticalOverlap=Math.min(r.bottom,br.bottom)-Math.max(r.top,br.top);
          return verticalOverlap>40 && (r.right<=br.left+24 || r.left>=br.right-24);
        });

        if(horizontalSibling){
          parent.classList.add('mq-mobile-stack-fix');
          break;
        }
        node=parent;
      }
    });
  }

  function applyQuestLayout(){
    if(!window.matchMedia('(max-width:800px)').matches) return;

    document.body.classList.remove('cover-active');

    const overlay=document.getElementById('stageOverlay');
    const frame=document.getElementById('stageFrame');

    /* Allow each stage iframe to receive normal vertical swipe scrolling. */
    if(frame && frame.getAttribute('scrolling')!=='yes'){
      frame.setAttribute('scrolling','yes');
    }

    /* If the stage overlay is no longer visible, never leave the map locked. */
    if(!overlay || !overlay.classList.contains('open')){
      document.documentElement.classList.remove('stage-open');
      document.body.classList.remove('stage-open');
      document.documentElement.style.removeProperty('overflow');
      document.documentElement.style.removeProperty('overflow-y');
      document.body.style.removeProperty('overflow');
      document.body.style.removeProperty('overflow-y');
    }

    findWorkingCards();
  }

  let raf=0;
  function schedule(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(applyQuestLayout);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',schedule,{once:true});
  }else{
    schedule();
  }
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  window.addEventListener('pageshow',schedule);
  window.addEventListener('focus',schedule);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) schedule(); });

  const mo=new MutationObserver(schedule);
  mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
  setTimeout(schedule,300);
  setTimeout(schedule,1000);
})();
<'+'/script>`;

    const readyScript='<script>document.body.classList.remove("cover-active");<'+'/script>';
    let html=gameHtml.replace('</head>',skipCoverCss+questMobileLayoutCss+'</head>');

    /* Never disable scrolling inside the full-screen stage iframe.
       This is especially important for Try Any Topic on Android. */
    html=html.replace(
      "frame.setAttribute('scrolling', 'no');",
      "frame.setAttribute('scrolling','yes');frame.style.overflow='auto';frame.style.webkitOverflowScrolling='touch';frame.style.touchAction='pan-y';"
    );

    html=html.replace('</body>',readyScript+questMobileLayoutScript+'</body>');

    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },350);
  }

  btn.addEventListener('click',launch);
  stage.addEventListener('click',(e)=>{
    if(e.target===btn) return;
    launch();
  });
  prepare();
})();
</script>
</body>
</html>

name: Fix Start Quest hotspot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-start-quest-hotspot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile Start Quest hotspot
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = """    @media (max-width:800px){
      .mq-cover-img{
        transform:scale(.95);
      }
      #mqStartQuestBtn{
        top:73.4%;
        width:58vw;
        height:10vh;
      }
      .mq-loading-text{
        top:86%;
      }
    }"""

          new = """    @media (max-width:800px){
      .mq-cover-img{
        transform:scale(.95);
      }
      #mqStartQuestBtn{
        top:57.6%;
        width:34vw;
        height:5.8vh;
      }
      .mq-loading-text{
        top:66%;
      }
    }"""

          if old not in s:
              raise SystemExit("Expected Start Quest mobile CSS block not found")

          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align Start Quest hotspot on mobile"
          git push

name: Fix Start Quest hotspot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-start-quest-hotspot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile Start Quest hotspot
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='top:73.4%;\\n        width:58vw;\\n        height:10vh;'; new='top:57.6%;\\n        width:34vw;\\n        height:5.8vh;'; assert old in s, 'old hotspot CSS not found'; s=s.replace(old,new,1); s=s.replace('top:86%;','top:66%;',1); p.write_text(s,encoding='utf-8')"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Align Start Quest hotspot on mobile"
          git push

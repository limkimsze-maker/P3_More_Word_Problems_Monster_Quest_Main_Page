name: Patch Monster Quest cover hitbox

on:
  push:
    paths:
      - '.github/workflows/patch-cover-hitbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align Start Quest hitbox to cover artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '''    @media (max-width:800px){
                .mq-cover-img{
                  transform:scale(.95);
                }
                #mqStartQuestBtn{
                  top:57.6%;
                  width:34vw;
                  height:5.8vh;
                }
                .mq-loading-text{
                  top:66%;
                }
              }'''
          new = '''    @media (max-width:800px){
                .mq-cover-img{
                  transform:scale(.95);
                }
                #mqStartQuestBtn{
                  top:calc(50% + min(14.44vw, 21.66vh));
                  width:min(31vw, 46.5vh);
                  height:max(44px, min(6.2vw, 9.3vh));
                }
                .mq-loading-text{
                  top:calc(50% + min(22vw, 33vh));
                }
              }'''
          if old not in s:
              raise SystemExit("Expected mobile cover block was not found.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-cover-hitbox.yml
          git add index.html .github/workflows/patch-cover-hitbox.yml
          git diff --cached --check
          git commit -m "Align mobile Start Quest hitbox"
          git push

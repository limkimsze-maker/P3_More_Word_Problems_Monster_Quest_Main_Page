name: One-time cover hitbox fix

on:
  push:
    paths:
      - ".github/workflows/fix-cover-hitbox.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align mobile Start Quest hitbox
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = """    @media (max-width:800px){
      .mq-cover-img{
        transform:scale(.95);
      }
      #mqStartQuestBtn{
        top:73.4%;
        width:58vw;
        height:10vh;
      }
      .mq-loading-text{
        top:86%;
      }
    }"""
          new = """    @media (max-width:800px){
      .mq-cover-img{
        transform:scale(.95);
      }
      #mqStartQuestBtn{
        top:58.6%;
        width:min(38vw, 285px);
        height:min(7vh, 82px);
      }
      .mq-loading-text{
        top:66%;
      }
    }"""
          if old not in s:
              raise SystemExit("Expected cover CSS block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-cover-hitbox.yml

      - name: Commit fix
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-cover-hitbox.yml
          git commit -m "Align mobile Start Quest hitbox with cover button"
          git push

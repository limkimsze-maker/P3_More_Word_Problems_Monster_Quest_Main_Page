name: Fix Monster Quest mobile start hitbox

on:
  push:
    paths:
      - '.github/workflows/fix-cover-hitbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile Start Quest hitbox
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = """    @media (max-width:800px){
                .mq-cover-img{
                  transform:scale(.95);
                }
                #mqStartQuestBtn{
                  top:57.6%;
                  width:34vw;
                  height:5.8vh;
                }
                .mq-loading-text{
                  top:66%;
                }
              }"""
          new = """    @media (max-width:800px){
                .mq-cover-img{
                  transform:scale(.95);
                }
                #mqStartQuestBtn{
                  top:42.2%;
                  width:50vw;
                  max-width:360px;
                  height:7.2vh;
                  min-height:58px;
                  max-height:92px;
                }
                .mq-loading-text{
                  top:49.5%;
                }
              }"""
          if old not in s:
              raise SystemExit("Expected mobile cover CSS block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align mobile Start Quest hitbox"
          git push

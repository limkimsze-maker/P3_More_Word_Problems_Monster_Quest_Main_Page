name: Fix Monster Quest mobile start hitbox

on:
  push:
    paths:
      - '.github/workflows/fix-cover-hitbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile Start Quest hitbox
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = """      #mqStartQuestBtn{
                top:calc(50% + min(14.44vw, 21.66vh));
                width:min(31vw, 46.5vh);
                height:max(44px, min(6.2vw, 9.3vh));
              }"""
          new = """      #mqStartQuestBtn{
                top:42.2%;
                width:50vw;
                max-width:360px;
                height:7.2vh;
                min-height:58px;
                max-height:92px;
              }"""
          if old not in s:
              raise SystemExit("Current mobile Start Quest block not found")
          s = s.replace(old, new, 1)
          old_load = """      .mq-loading-text{
                top:calc(50% + min(22vw, 33vh));
              }"""
          new_load = """      .mq-loading-text{
                top:49.5%;
              }"""
          if old_load in s:
              s = s.replace(old_load, new_load, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align mobile Start Quest hitbox"
          git push

name: Fix cover hitbox

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-cover-hitbox.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align mobile Start Quest hitbox
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'Expected mobile cover block not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-cover-hitbox.yml
          git add index.html .github/workflows/fix-cover-hitbox.yml
          git commit -m "Align Start Quest hitbox with cover artwork"
          git push

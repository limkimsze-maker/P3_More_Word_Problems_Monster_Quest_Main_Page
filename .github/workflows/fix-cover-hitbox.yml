name: Fix cover hitbox

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-cover-hitbox.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align mobile Start Quest hitbox
        run: python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="    @media (max-width:800px){\n      .mq-cover-img{\n        transform:scale(.95);\n      }\n      #mqStartQuestBtn{\n        top:42.2%;\n        width:50vw;\n        max-width:360px;\n        height:7.2vh;\n        min-height:58px;\n        max-height:92px;\n      }\n      .mq-loading-text{\n        top:49.5%;\n      }\n    }"; new="    @media (max-width:800px){\n      .mq-cover-img{\n        transform:scale(.95);\n      }\n      #mqStartQuestBtn{\n        /* Cover artwork is 3:2 and centred with scale(.95).\n           This locks the tap target to the printed START QUEST button. */\n        top:calc(50% + 13.9vw);\n        width:34vw;\n        max-width:none;\n        height:8vw;\n        min-height:44px;\n        max-height:none;\n      }\n      .mq-loading-text{\n        top:calc(50% + 20.3vw);\n      }\n    }"; assert old in s, "Expected mobile cover block not found"; p.write_text(s.replace(old,new,1),encoding="utf-8")'
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-cover-hitbox.yml
          git add index.html .github/workflows/fix-cover-hitbox.yml
          git commit -m "Align Start Quest hitbox with cover artwork"
          git push

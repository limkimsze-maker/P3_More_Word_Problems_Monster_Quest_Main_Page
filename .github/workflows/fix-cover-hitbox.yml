name: Fix Monster Quest mobile start hitbox

on:
  push:
    paths:
      - '.github/workflows/fix-cover-hitbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile Start Quest hitbox
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          pattern = r'(#mqStartQuestBtn\s*\{\s*)top:57\.6%;\s*width:34vw;\s*height:5\.8vh;'
          replacement = r'''\1top:42.2%;
                width:50vw;
                max-width:360px;
                height:7.2vh;
                min-height:58px;
                max-height:92px;'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f"Expected one mobile Start Quest hitbox block; found {n}")
          s2 = re.sub(r'(\.mq-loading-text\s*\{\s*)top:66%;', r'\1top:49.5%;', s2, count=1)
          p.write_text(s2, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align mobile Start Quest hitbox"
          git push
